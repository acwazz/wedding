name: release-infra

on:
  push:
    tags:
      - "infra-*"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      # ponytail: fixed passphrase — state holds no secrets; rotate if secrets ever added
      PULUMI_CONFIG_PASSPHRASE: local
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Pulumi CLI
        run: |
          curl -fsSL https://get.pulumi.com | sh
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"
      - name: pulumi login (local state)
        run: pulumi login file://$PWD
      - name: pulumi up
        run: pulumi up --stack dev --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Commit state back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pulumi
          git diff --cached --quiet || (git commit -m "pulumi state: $GITHUB_REF_NAME" && git push origin HEAD:${{ github.event.repository.default_branch }})
